services:
  postgres:
    image: postgres:17-alpine
    container_name: api-observatory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: observatory_dev
    ports:
      - "5432:5432"
    volumes:
      - observatory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory -d observatory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  observatory-postgres-data:
