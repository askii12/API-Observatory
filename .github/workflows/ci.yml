
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory_dev
          POSTGRES_DB: observatory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatory -d observatory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://observatory:observatory_dev@localhost:5432/observatory_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
